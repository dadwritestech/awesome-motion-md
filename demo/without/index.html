<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<style>
:root{
  --bg:#0b0c10;--surface:#13151b;--surface-2:#1a1d25;--border:#23262f;--border-2:#2d313c;
  --text:#e8eaf0;--muted:#8b90a0;--accent:#7c83ff;--accent-2:#9aa0ff;
  --ease:cubic-bezier(.22,1,.36,1);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 400px at 50% -100px,rgba(124,131,255,.12),transparent)}
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;height:56px;padding:0 24px;
  background:rgba(11,12,16,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  animation:navIn .6s var(--ease) both}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;margin-right:18px}
.logo i{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);position:relative;display:inline-block}
.logo i::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent-2);top:-4px;right:-1px}
nav a{position:relative;color:var(--muted);text-decoration:none;font-size:14px;padding:7px 12px;border-radius:7px;
  transition:color .18s,background .18s}
nav a:hover{color:var(--text);background:var(--surface-2)}
nav a.active{color:var(--text)}
nav a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--border-2);background:var(--surface-2);color:var(--text);padding:8px 14px;border-radius:8px;
  font-size:14px;font-weight:500;transition:transform .15s var(--ease),background .18s,border-color .18s,box-shadow .18s}
.btn:hover{background:#222633;border-color:#3a3f4e}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:transparent;color:#0b0c18;font-weight:600}
.btn.primary:hover{background:var(--accent-2);box-shadow:0 4px 18px rgba(124,131,255,.4)}
main{max-width:760px;margin:0 auto;padding:44px 24px 80px}
h1{margin:0;font-size:28px;letter-spacing:-.02em;animation:rise .6s .08s var(--ease) both}
.sub{margin:6px 0 28px;color:var(--muted);font-size:15px;animation:rise .6s .14s var(--ease) both}
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;cursor:pointer;opacity:0;animation:rise .55s var(--ease) forwards;animation-delay:calc(var(--i,0)*60ms + 200ms);
  transition:transform .22s var(--ease),border-color .2s,background .2s,box-shadow .25s}
.card:hover{transform:translateY(-2px);background:var(--surface-2);border-color:var(--border-2);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card.new{animation:cardNew .5s var(--ease) forwards;animation-delay:0s}
.id{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:58px;font-family:ui-monospace,Consolas,monospace}
.title{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid transparent}
.s-todo{color:#a3a8b8;background:rgba(163,168,184,.1);border-color:rgba(163,168,184,.2)}
.s-prog{color:#f5c15a;background:rgba(245,193,90,.1);border-color:rgba(245,193,90,.25)}
.s-rev{color:#b69cff;background:rgba(182,156,255,.1);border-color:rgba(182,156,255,.25)}
.s-done{color:#58d68d;background:rgba(88,214,141,.1);border-color:rgba(88,214,141,.25)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0b0c18;
  transition:transform .22s var(--ease)}
.card:hover .avatar{transform:scale(1.1)}
#overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,6,9,.6);backdrop-filter:blur(4px);
  opacity:0;visibility:hidden;transition:opacity .22s,visibility 0s .22s}
#overlay.open{opacity:1;visibility:visible;transition:opacity .22s}
#dialog{width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border-2);border-radius:14px;padding:22px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);transform:translateY(14px) scale(.96);opacity:0;
  transition:transform .3s var(--ease),opacity .22s}
#overlay.open #dialog{transform:none;opacity:1}
#dialog h2{margin:0 0 14px;font-size:17px}
#title-input{width:100%;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--border-2);color:var(--text);
  font:inherit;font-size:15px;transition:border-color .18s,box-shadow .18s}
#title-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,131,255,.2)}
#title-input.shake{animation:shake .35s}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;right:24px;bottom:24px;z-index:60;padding:11px 16px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--border-2);box-shadow:0 12px 32px rgba(0,0,0,.5);font-size:14px;display:flex;align-items:center;gap:9px;
  transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .25s}
#toast.show{transform:none;opacity:1}
#toast::before{content:"✓";display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#58d68d;color:#07140c;font-size:11px;font-weight:800}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes navIn{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes cardNew{from{opacity:0;transform:translateY(-14px) scale(.97);background:#232750}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media (max-width:560px){.pill{display:none}nav{padding:0 14px}}
</style>
</head>
<body>
<nav>
  <div class="logo"><i></i>Orbit</div>
  <a href="#" class="active">Issues</a><a href="#">Projects</a><a href="#">Views</a>
  <div class="spacer"></div>
  <button class="btn primary" id="new-issue">New issue</button>
</nav>
<main>
  <h1>Issues</h1>
  <p class="sub">Everything your team is working on, in one place.</p>
  <ul id="list"></ul>
</main>

<div id="overlay">
  <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-h">
    <h2 id="dlg-h">New issue</h2>
    <input id="title-input" type="text" placeholder="Issue title" autocomplete="off" aria-label="Issue title">
    <div class="actions">
      <button class="btn" id="cancel">Cancel</button>
      <button class="btn primary" id="create">Create</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite">Issue created</div>

<script>
(function(){
  var STATUS={todo:["Todo","s-todo"],prog:["In Progress","s-prog"],rev:["In Review","s-rev"],done:["Done","s-done"]};
  var COLORS=["#9aa0ff","#f5c15a","#58d68d","#ff8fa3","#6fd3e8","#c79bff"];
  var seed=[
    ["ORB-12","Fix flaky sync on slow connections","prog","A"],
    ["ORB-11","Redesign onboarding checklist","rev","M"],
    ["ORB-10","Add keyboard shortcuts to the command bar","todo","J"],
    ["ORB-9","Migrate billing webhooks to v2","done","S"],
    ["ORB-8","Dark mode contrast audit","prog","K"],
    ["ORB-7","Write docs for the public API","todo","R"]
  ];
  var list=document.getElementById("list"),overlay=document.getElementById("overlay"),
      input=document.getElementById("title-input"),toast=document.getElementById("toast"),
      opener=document.getElementById("new-issue"),next=13,tt,lastFocus;

  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  function card(d,i,isNew){
    var li=document.createElement("li");
    li.className="card"+(isNew?" new":"");li.style.setProperty("--i",i);
    var st=STATUS[d[2]];
    li.innerHTML='<span class="id">'+d[0]+'</span><span class="title">'+esc(d[1])+
      '</span><span class="pill '+st[1]+'">'+st[0]+'</span><span class="avatar" style="background:'+
      COLORS[d[3].charCodeAt(0)%COLORS.length]+'">'+d[3]+'</span>';
    return li;
  }
  seed.forEach(function(d,i){list.appendChild(card(d,i))});

  function open(){
    lastFocus=document.activeElement;input.value="";
    overlay.classList.add("open");
    setTimeout(function(){input.focus()},60);
  }
  function close(){
    overlay.classList.remove("open");
    if(lastFocus)lastFocus.focus();
  }
  function create(){
    var v=input.value.trim();
    if(!v){input.classList.remove("shake");void input.offsetWidth;input.classList.add("shake");input.focus();return}
    close();
    var c=card(["ORB-"+(next++),v,"todo","V"],0,true);
    list.insertBefore(c,list.firstChild);
    toast.classList.add("show");clearTimeout(tt);
    tt=setTimeout(function(){toast.classList.remove("show")},2500);
  }
  opener.addEventListener("click",open);
  document.getElementById("cancel").addEventListener("click",close);
  document.getElementById("create").addEventListener("click",create);
  overlay.addEventListener("mousedown",function(e){if(e.target===overlay)close()});
  input.addEventListener("keydown",function(e){if(e.key==="Enter")create()});
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&overlay.classList.contains("open"))close();
    if(e.key==="Tab"&&overlay.classList.contains("open")){
      var f=[input,document.getElementById("cancel"),document.getElementById("create")],
          i=f.indexOf(document.activeElement);
      e.preventDefault();f[(i+(e.shiftKey?f.length-1:1))%f.length].focus();
    }
  });
})();
</script>
</body>
</html>
